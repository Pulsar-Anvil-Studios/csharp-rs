name: Rust Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: Check, Lint & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests with coverage
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info

      - name: Check global coverage threshold
        id: global-threshold
        continue-on-error: true
        run: cargo llvm-cov report --fail-under-lines 90

      - name: Check global region coverage threshold
        id: global-region-threshold
        continue-on-error: true
        run: cargo llvm-cov report --fail-under-regions 85

      - name: Diff coverage report
        if: github.event_name == 'pull_request'
        id: diff-coverage
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x .github/scripts/diff-coverage.sh
          .github/scripts/diff-coverage.sh \
            lcov.info \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.number }}" \
            95 \
            90

      - name: Coverage summary
        if: always()
        run: |
          {
            echo '## Coverage Report'
            echo '```'
            cargo llvm-cov report 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce coverage thresholds
        if: steps.global-threshold.outcome == 'failure' || steps.global-region-threshold.outcome == 'failure' || steps.diff-coverage.outcome == 'failure'
        run: |
          echo "::error::Coverage threshold not met (line >= 90%, region >= 85%, diff >= 95%)"
          exit 1

  csharp-compilation:
    name: C# Compilation Verification
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-csharp-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-csharp-

      - name: Run C# compilation tests
        run: cargo test --test csharp_compilation --all-features -- --ignored

      - name: Run C# round-trip tests
        run: cargo test --test csharp_roundtrip --all-features -- --ignored
