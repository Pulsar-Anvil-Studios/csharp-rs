[workspace]
resolver = "2"
members = ["crates/csharp-rs", "crates/csharp-rs-macros"]

[workspace.package]
edition = "2024"
rust-version = "1.85"
authors = ["Clément Cornut <cornut.clem@gmail.com>"]
license = "MIT"
homepage = "https://github.com/Pulsar-Anvil-Studios/csharp-rs"
repository = "https://github.com/Pulsar-Anvil-Studios/csharp-rs"
keywords = ["csharp", "codegen", "derive", "serde", "unity"]
categories = ["development-tools::ffi", "development-tools::build-utils"]
readme = "README.md"

[workspace.dependencies]
# Proc macro utilities
syn = { version = "2.0.114", features = ["full", "extra-traits"] }
quote = "1.0.44"
proc-macro2 = "1.0.106"

# Optional external type support
chrono = { version = "0.4", default-features = false }
uuid = { version = "1", default-features = false }
serde_json = "1"

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Restriction lints for consistency and quality
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
deref_by_slicing = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
if_then_some_else_none = "warn"
map_err_ignore = "warn"
redundant_type_annotations = "warn"
semicolon_outside_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
unneeded_field_pattern = "warn"
unused_result_ok = "warn"

# Allow structured logging format args
literal_string_with_formatting_args = "allow"
# Allow multiple crate versions (transitive deps)
multiple_crate_versions = "allow"
